<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual audit fixture</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 390px; min-height: 844px; font-family: sans-serif; }
      body { overflow-x: hidden; background: #fff; }
      #good-surface { position: relative; width: 390px; height: 100px; margin-top: 80px; padding: 20px; }
      #good-target { width: 44px; height: 44px; border: 0; padding: 0; }
      #bad-surface { position: relative; width: 390px; height: 744px; }
      #colliding-title { position: absolute; left: 20px; top: 30px; width: 200px; height: 40px; margin: 0; }
      #colliding-button { position: absolute; left: 160px; top: 40px; width: 100px; height: 44px; }
      #small-target { position: absolute; left: 20px; top: 110px; width: 32px; height: 32px; padding: 0; }
      #clip-zone { position: absolute; left: 20px; top: 180px; width: 120px; height: 44px; overflow: hidden; }
      #clipped-button { position: absolute; left: 80px; top: 0; width: 100px; height: 44px; }
      #offscreen-dialog { position: absolute; left: 20px; top: 680px; width: 300px; height: 200px; }
      #fixed-preview-chip { position: fixed; z-index: 10; left: 10px; top: 6px; width: 176px; height: 44px; }
      #obstructed-heading { position: absolute; left: 10px; top: 24px; width: 180px; height: 36px; margin: 0; }
    </style>
  </head>
  <body data-audit-route="/visual-audit-fixture">
    <button id="fixed-preview-chip" type="button">Preview — sample data</button>
    <h2 id="obstructed-heading">Events</h2>
    <main id="good-surface" aria-label="Good surface">
      <button id="good-target" type="button" aria-label="Good target"></button>
    </main>
    <main id="bad-surface" aria-label="Bad surface">
      <h1 id="colliding-title">Colliding title</h1>
      <button id="colliding-button" type="button">Colliding button</button>
      <button id="small-target" type="button">Small target</button>
      <div id="clip-zone"><button id="clipped-button" type="button">Clipped button</button></div>
      <div id="offscreen-dialog" role="dialog" aria-label="Offscreen dialog">Dialog</div>
    </main>
  </body>
</html>
