<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai" />
    <meta name="tdm-reservation" content="1" />
    <title>Page not found | Union Ground</title>
    <style>
      :root {
        --page-canvas: #f7f3e8;
        --page-card: #fffdf8;
        --page-ink: #10271f;
        --page-muted: #52645c;
        --page-border: #c8d0ca;
        --page-primary: #176b50;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--page-canvas); color: var(--page-ink); font-family: "Public Sans", system-ui, sans-serif; }
      header, footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px clamp(20px, 5vw, 72px); border-color: var(--page-border); }
      header { border-bottom: 1px solid var(--page-border); }
      footer { border-top: 1px solid var(--page-border); color: var(--page-muted); }
      nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
      a { min-height: 44px; display: inline-flex; align-items: center; color: var(--page-primary); font-weight: 750; text-underline-offset: 3px; }
      .brand { color: var(--page-ink); font-size: 18px; font-weight: 850; text-decoration: none; }
      main { width: min(720px, calc(100% - 40px)); margin: auto; padding: clamp(44px, 8vw, 92px) 0; }
      article { border: 1px solid var(--page-border); border-radius: 20px; padding: clamp(28px, 6vw, 56px); background: var(--page-card); }
      .eyebrow { margin: 0 0 12px; color: var(--page-primary); font-size: 13px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Archivo, system-ui, sans-serif; font-size: clamp(36px, 7vw, 64px); line-height: 1; letter-spacing: -.04em; }
      p { max-width: 58ch; margin: 20px 0 0; color: var(--page-muted); font-size: 17px; line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 24px; }
      @media (max-width: 640px) { header, footer { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Union Ground</a>
      <nav aria-label="Site links"><a href="/about">About</a><a href="/contact">Contact</a></nav>
    </header>
    <main>
      <article>
        <p class="eyebrow">404</p>
        <h1>Page not found</h1>
        <p>The address may be incomplete, outdated, or unavailable. Return to the home page.</p>
        <nav class="actions" aria-label="Next steps"><a href="/">Go to the home page</a><a href="/contact">Contact</a></nav>
      </article>
    </main>
    <footer><span>Union Ground</span><nav aria-label="Legal links"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/accessibility">Accessibility</a></nav></footer>
  </body>
</html>
