<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f2e9" />
    <meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai" />
    <meta name="tdm-reservation" content="1" />
    <title>Offline — Union Ground</title>
    <style>
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; background: #f6f2e9; color: #14201c; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center; }
      main { padding: 24px; }
      .mark { display: inline-block; width: 56px; height: 56px; border-radius: 13px; overflow: hidden; line-height: 0; }
      h1 { margin: 14px 0 6px; font-size: 22px; }
      p { margin: 0 0 4px; color: #5c6a63; font-size: 14px; }
      button { margin-top: 16px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #0e4034; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#3f4a46"/><rect x="20" y="20" width="24" height="24" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/></svg></span>
      <h1>You're offline</h1>
      <p>Union Ground needs a connection to load your organizing workspace.</p>
      <p lang="es">Union Ground necesita conexión para cargar tu espacio de organización.</p>
      <button onclick="location.reload()">Try again · Reintentar</button>
    </main>
  </body>
</html>
