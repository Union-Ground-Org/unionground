plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.storeagesignal'
version = '1.0.0'

android {
  namespace "expo.modules.storeagesignal"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Play Age Signals API (minSdk 23). Pinned exactly; a new version is a
  // reviewed change because the response model moved between betas.
  implementation 'com.google.android.play:age-signals:0.0.4'
}
